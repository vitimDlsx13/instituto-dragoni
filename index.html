<body>
  <!-- Mensagem inicial exibida enquanto os arquivos do site são preparados. -->
  <div id="__bundler_placeholder">Loading Instituto Dragoni - Cursos Online...</div>

  <!-- Início do carregador que reconstrói e exibe os arquivos do site. -->
  <script>
// Espera o navegador montar o HTML inicial antes de localizar os elementos da tela.
document.addEventListener('DOMContentLoaded', async function() {
  // Guarda o elemento que mostra o andamento do carregamento.
  const loading = document.getElementById('__bundler_loading');
  // Atualiza o aviso somente se ele ainda estiver presente na página.
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Reconhece os tipos de arquivo usados por fontes, para tratá-las corretamente.
  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  // Confere se o tipo MIME tem o formato esperado: categoria/subtipo.
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  // Converte bytes em texto Base64 em blocos, evitando exceder limites de argumentos.
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Mantém o ouvinte de erros ligado à janela, mesmo quando o HTML é substituído.
  window.addEventListener('error', function(e) {
    // Falhas ao carregar recursos apontam para o elemento; apenas registramos um aviso.
    // Erros reais de JavaScript incluem mensagem ou objeto de erro e aparecem na tela.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    // Usa o corpo da página ou, se ainda não existir, o próprio elemento HTML.
    var p = document.body || document.documentElement;
    // Reaproveita o painel de erros existente ou cria um novo.
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    // Aplica ao painel um estilo visível e mantém mensagens longas roláveis.
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    // Acrescenta a mensagem do erro e, quando disponível, o arquivo e a linha.
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  // Captura falhas do processo de reconstrução para informar o usuário e o console.
  try {
    // Procura no HTML os dados empacotados e o modelo da página que será exibida.
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    // Interrompe o processo e registra um diagnóstico se algum dado obrigatório faltar.
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    // Lê os dados JSON: o manifesto contém arquivos e o modelo contém o HTML do site.
    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    // Define o valor de demonstração nos cards e troca o texto original dos botões.
    template = template
      .replace(/R\$ \[PREÇO\]/g, 'R$ 49,90')
      .replace(/>Matricular<\/a>/g, '>Saiba +</a>');

    // As páginas internas dos iframes são armazenadas uma única vez no manifesto raiz.
    // O endereço marcador about:blank#UUID identifica qual conteúdo cada iframe precisa.
    // Cada documento cria os próprios endereços Blob, usando dados locais ou recebidos
    // do documento pai direto. Isso permite abrir páginas internas em diferentes níveis,
    // inclusive ao abrir o arquivo localmente, sem reutilizar um Blob de outro documento.
    // Lê a ordem das páginas internas, quando esses dados opcionais estiverem disponíveis.
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    // Usa um conjunto para verificar rapidamente se um UUID corresponde a uma página.
    const pageSet = new Set(pageOrder);
    // Armazena o texto decodificado das páginas internas antes de criar seus iframes.
    const pageTexts = {};

    // ── Comunicação segura entre páginas internas e seus documentos pais ──
    // As páginas são guardadas no manifesto raiz, mas cada iframe recebe um Blob próprio.
    // Uma página interna pede os dados ao pai direto; o pai só atende aos iframes que criou.
    // Respostas só são aceitas do pai direto e para UUIDs que já foram solicitados.
    // A página raiz não repassa pedidos para cima, pois seu possível ancestral pode ser externo.
    // Assim, o conteúdo não é enviado a páginas externas nem aceito delas por engano.
    // A origem é verificada em cada mensagem; em contextos locais/sandbox, pode ser "null".
    // Usamos window.origin (origem de segurança serializada), não location.origin,
    // que pode indicar a URL original mesmo dentro de um contexto isolado.
    // Define o destino das mensagens: origem HTTPS conhecida ou "*" quando ela é opaca.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    // Verifica se a origem da mensagem é compatível com este documento.
    function trustedOrigin(e) {
      // Em páginas HTTPS e em alguns contextos opacos, as origens coincidem.
      if (e.origin === window.origin) return true;
      // No Chrome, documentos file:// e seus Blobs podem aparecer como "file://" e "null".
      // Aceitamos apenas essa combinação; a identidade do remetente também é verificada.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Só a página raiz possui uma lista não vazia; ela responde usando os dados locais.
    // Se não encontrar uma página, considera a busca encerrada e não consulta o ancestral.
    const isPageRoot = pageOrder.length > 0;
    // Guarda endereços Blob criados para páginas e recursos do site.
    const blobUrls = {};
    // Mantém os objetos Blob disponíveis para scripts que precisem ler seus dados.
    const resourceBlobs = {};
    // Expressão regular para validar o formato dos identificadores UUID do empacotador.
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    // Guarda iframes aguardando o texto da página, indexados pelo UUID.
    const pendingFrames = {};
    // Guarda iframes filhos aguardando que o texto recebido seja repassado.
    const pendingRelays = {};
    // Cria o Blob da página interna e aplica seu endereço ao iframe correspondente.
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    // Entrega o texto recebido aos iframes locais e aos filhos que aguardavam repasse.
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          // Um iframe pode ter sido removido antes da resposta; nesse caso, não há destino.
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* janela do iframe já foi fechada */ }
        }
      }
    }
    // Lista as janelas dos iframes que pertencem diretamente a este documento.
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        // Alguns iframes podem ser removidos durante a leitura; ignora apenas esses casos.
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* iframe já foi removido */ }
      }
      return out;
    }
    // Recebe pedidos de conteúdo e respostas enviados pelos documentos relacionados.
    window.addEventListener('message', function (e) {
      const d = e.data;
      // Ignora mensagens vazias, dados que não sejam objetos ou remetentes ausentes.
      if (!d || typeof d !== 'object' || !e.source) return;
      // Valida a origem antes de analisar a mensagem; abaixo também se confirma
      // se o pedido veio de um iframe próprio e se a resposta veio do pai direto.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Só atende pedidos feitos por iframes filhos que pertencem a este documento.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need; 
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          // Envia o conteúdo encontrado diretamente ao iframe que fez o pedido.
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* janela do iframe já foi fechada */ }
          return;
        }
        // A raiz não procura em outro documento; um documento interno pode consultar seu pai.
        if (isPageRoot || window.parent === window) return;
        const waiting = pendingRelays[uuid];
        if (waiting) {
          // Agrupa vários pedidos pelo mesmo UUID para evitar mensagens duplicadas ao pai.
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Limita pedidos pendentes para impedir que solicitações sem resposta
        // ocupem memória indefinidamente.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        // Repassa o pedido somente ao documento pai direto.
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // Exige UUID válido antes de consultar os pedidos pendentes.
        // Isso impede que nomes especiais de propriedades do JavaScript
        // sejam tratados como identificadores de página.
        // Aceita o texto somente do pai direto que enviou a página interna.
        if (e.source !== window.parent || window.parent === window) return;
        // Descarta respostas para UUIDs que não estejam sendo aguardados.
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    // Lista os identificadores dos arquivos e informa quantos serão processados.
    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    // Decodifica cada arquivo do manifesto; arquivos independentes podem ser processados juntos.
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        // Converte o conteúdo Base64 em bytes binários.
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        // Mantém os bytes originais, a menos que o manifesto indique compressão gzip.
        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            // Descompacta o arquivo em partes e calcula o tamanho final.
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            // Junta as partes descompactadas em um único conjunto de bytes.
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            // Informa quando o navegador não oferece suporte à descompactação necessária.
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        // Páginas internas são guardadas como texto para serem fornecidas aos iframes.
        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Alguns servidores permitem fontes data:, mas bloqueiam fontes blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          // Cria um endereço temporário Blob para imagens, scripts e outros recursos.
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        // Registra a falha e cria um recurso vazio para não interromper todo o carregamento.
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    // Lê a relação entre os endereços originais dos recursos e seus identificadores internos.
    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    // Monta o mapa que os scripts do site usam para localizar recursos empacotados.
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Disponibiliza os objetos Blob diretamente, pois alguns servidores bloqueiam
    // chamadas fetch() para endereços blob:. A referência permanece após a troca do HTML.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Substitui cada UUID do modelo pelo endereço do arquivo já decodificado.
    // UUIDs de páginas internas são resolvidos depois, a partir dos marcadores dos iframes.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Remove integrity e crossorigin apenas de elementos que agora apontam
    // para Blob criado por este carregador. Em arquivos locais, esses atributos
    // podem impedir o carregamento por causa da origem opaca. Recursos externos
    // que continuam sendo baixados da rede mantêm suas verificações de integridade.
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    // Cria um script para publicar no site o mapa de recursos construído acima.
    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Insere o script logo após a abertura de <head>, sem deslocar o DOCTYPE.
    // O padrão aceita atributos no elemento <head>; slice() evita substituições
    // especiais que poderiam ocorrer com replace() ao inserir o conteúdo.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Interpreta o modelo como HTML e substitui a página inicial pelo site reconstruído.
    // Scripts criados por DOMParser não são executados automaticamente; eles serão
    // recriados abaixo, aguardando cada arquivo externo para preservar a ordem de execução.
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Procura iframes com marcadores de página e resolve o conteúdo de cada um.
    // Usa o texto local quando disponível; caso contrário, solicita ao pai direto.
    // Se não houver resposta, o iframe permanece em about:blank.
    {
      // Reconhece o UUID e preserva qualquer fragmento adicional do endereço.
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      // Reúne UUIDs que precisam ser solicitados ao pai, sem repetir pedidos.
      const needed = [];
      // Percorre os iframes da página reconstruída.
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          // Se o conteúdo já estiver disponível, monta o iframe imediatamente.
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          // Registra o iframe como pendente e agenda uma solicitação ao documento pai.
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      // Solicita ao pai direto o conteúdo de cada página ainda não disponível.
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    // Recria os scripts no documento novo para permitir que o navegador os execute.
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      // Copia atributos e código do script original para um novo elemento executável.
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // Scripts Babel/JSX com src são carregados como texto e inseridos diretamente.
      // Isso evita que a origem opaca de um arquivo local impeça a leitura pelo Babel.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      // Para scripts externos, cria uma espera até que o carregamento termine.
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // O evento DOMContentLoaded já ocorreu antes da troca do documento;
    // por isso, solicita manualmente ao Babel que transforme scripts JSX/Babel.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    // Cria uma área de aluno demonstrativa, armazenada somente neste navegador.
    // Este fluxo não processa pagamentos nem substitui um servidor de autenticação.
    const DEMO_STORAGE_KEY = 'institutoDragoniDemo';
    let demoData = { users: [], currentEmail: null };
    let storageMessage = '';
    try {
      const savedData = localStorage.getItem(DEMO_STORAGE_KEY);
      if (savedData) {
        const parsedData = JSON.parse(savedData);
        if (!parsedData || !Array.isArray(parsedData.users)) {
          throw new Error('Os dados salvos da demonstração estão em um formato inválido.');
        }
        demoData = parsedData;
      }
    } catch (storageError) {
      storageMessage = 'Não foi possível ler os dados salvos. Confira as permissões de armazenamento do navegador.';
      console.error('Erro ao carregar os dados da demonstração:', storageError);
    }

    // Salva os dados da demonstração e informa claramente se o navegador bloquear o armazenamento.
    function saveDemoData() {
      try {
        localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(demoData));
        storageMessage = '';
        return true;
      } catch (storageError) {
        storageMessage = 'Não foi possível salvar. Verifique se o armazenamento do navegador está disponível.';
        console.error('Erro ao salvar os dados da demonstração:', storageError);
        return false;
      }
    }

    // Busca a conta que está conectada nesta sessão do navegador.
    function getLoggedUser() {
      return demoData.users.find(function(user) {
        return user.email === demoData.currentEmail;
      }) || null;

      return courseCurricula[title] || {

    // Torna o preço visível nos cards e troca a matrícula por um link para os detalhes.
    function prepareCourseCatalog() {
      const grid = document.querySelector('#cursos article') && document.querySelector('#cursos article').parentElement;
      if (!grid) return;

      grid.querySelectorAll('article:not([data-demo-admin-course])').forEach(function(card) {
        const title = card.querySelector('h3');
        const courseLink = Array.from(card.querySelectorAll('a')).find(function(link) {
          const label = link.textContent.trim().toLowerCase();
          return label === 'matricular' || label === 'saiba +';
        });
        if (!title || !courseLink) return;
        const originalTitle = card.getAttribute('data-demo-original-title') || title.textContent.trim();
        card.setAttribute('data-demo-original-title', originalTitle);
        const savedCourse = adminCourses.find(function(course) {
          return course.id === 'builtin:' + originalTitle;
        });
        if (savedCourse) {
          if (title.textContent.trim() !== savedCourse.title) title.textContent = savedCourse.title;
          courseCurricula[savedCourse.title] = savedCourse;
        }
        const price = Array.from(card.querySelectorAll('span.sc-interp')).find(function(span) {
          return span.textContent.trim().startsWith('R$');
        });
        const displayPrice = savedCourse && savedCourse.price ? savedCourse.price : COURSE_PRICE;
        if (price && price.textContent.trim() !== displayPrice) price.textContent = displayPrice;
        if (courseLink.textContent.trim() !== 'Saiba +') courseLink.textContent = 'Saiba +';
        courseLink.setAttribute('aria-label', 'Saiba mais sobre ' + title.textContent.trim() + ' — ' + displayPrice);
        courseLink.setAttribute('href', '#');
        const cover = card.firstElementChild;
        if (cover && savedCourse && savedCourse.imageUrl && isAllowedMediaUrl(savedCourse.imageUrl)) {
          let image = cover.querySelector('[data-demo-course-image]');
          if (!image) {
            image = document.createElement('img');
            image.setAttribute('data-demo-course-image', '');
            image.alt = '';
            image.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42';
            cover.prepend(image);
          }
          if (image.src !== savedCourse.imageUrl) image.src = savedCourse.imageUrl;
        }
      });

      grid.querySelectorAll('[data-demo-admin-course]').forEach(function(card) {
        card.remove();
      });
      const activeFilter = document.querySelector('#cursos [aria-pressed="true"]');
      const activeCategory = activeFilter ? activeFilter.textContent.trim() : 'Todos';
      adminCourses.filter(function(course) {
        return course.id.indexOf('custom:') === 0;
      }).filter(function(course) {
        return activeCategory === 'Todos' || activeCategory === course.category;
      }).forEach(function(course) {
        const card = document.createElement('article');
        card.setAttribute('data-demo-admin-course', '');
        card.style.cssText = 'display:flex;flex-direction:column;overflow:hidden;border:1px solid #DCE6F5;border-radius:18px;background:#FFFFFF;box-shadow:0 10px 28px rgba(7,24,58,.08)';
        const cover = document.createElement('div');
        cover.style.cssText = 'position:relative;height:124px;overflow:hidden;background:linear-gradient(135deg,#07183A,#0B3C7D 55%,#0F5BB5)';
        if (course.imageUrl && isAllowedMediaUrl(course.imageUrl)) {
          const image = document.createElement('img');
          image.src = course.imageUrl;
          image.alt = '';
          image.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48';
          cover.appendChild(image);
        }
        const category = document.createElement('span');
        category.textContent = course.category || 'Curso';
        category.style.cssText = 'position:absolute;left:14px;top:14px;padding:6px 12px;border-radius:999px;background:#F5B21B;color:#07183A;font-size:12px;font-weight:800';
        cover.appendChild(category);
        const body = document.createElement('div');
        body.style.cssText = 'display:flex;flex:1;flex-direction:column;gap:12px;padding:20px';
        const heading = document.createElement('h3');
        heading.textContent = course.title;
        heading.style.cssText = 'margin:0;color:#07183A;font-size:19px';
        const description = document.createElement('p');
        description.textContent = course.description;
        description.style.cssText = 'margin:0;color:#4A5878;font-size:14px;line-height:1.5';
        const footer = document.createElement('div');
        footer.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid #E6EDF8';
        const price = document.createElement('strong');
        price.textContent = course.price || COURSE_PRICE;
        price.style.cssText = 'color:#0B3C7D;font-size:17px';
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = 'Saiba +';
        link.setAttribute('aria-label', 'Saiba mais sobre ' + course.title + ' — ' + (course.price || COURSE_PRICE));
        link.style.cssText = 'padding:10px 15px;border-radius:9px;background:#F5B21B;color:#07183A;font-size:14px;font-weight:800';
        footer.append(price, link);
        body.append(heading, description, footer);
        card.append(cover, body);
        grid.appendChild(card);
      });
    }

    // Aceita apenas links HTTP/HTTPS para as mídias cadastradas pelo administrador.
    function isAllowedMediaUrl(value) {
      try {
        const parsedUrl = new URL(value);
        return parsedUrl.protocol === 'https:' || parsedUrl.protocol === 'http:';
      } catch (invalidUrlError) {
        return false;
      }
    }

    const demoOverlay = document.createElement('div');

    demoOverlay.innerHTML = '<section class="dg-demo-dialog" role="dialog" aria-modal="true" aria-labelledby="dg-demo-title"><button class="dg-demo-close" type="button" data-demo-action="close" aria-label="Fechar">×</button><div id="dg-demo-content"></div></section>';

    // Lista os cursos do catálogo usando os dados já cadastrados no site.
    function getAdminCourseEntries() {
      const builtIn = Array.from(document.querySelectorAll('#cursos article:not([data-demo-admin-course])'))
        .map(function(card) {
          const heading = card.querySelector('h3');
          if (!heading) return null;
          const originalTitle = card.getAttribute('data-demo-original-title') || heading.textContent.trim();
          const saved = adminCourses.find(function(course) {
            return course.id === 'builtin:' + originalTitle;
          });
          const category = card.querySelector('span.sc-interp');
          const baseInfo = courseCurricula[originalTitle] || getCourseInfo(originalTitle);
          return Object.assign({}, baseInfo, saved || {}, {
            id: 'builtin:' + originalTitle,
            originalTitle: originalTitle,
            title: saved ? saved.title : originalTitle,
            category: saved ? saved.category : (category ? category.textContent.trim() : 'Curso'),
            price: saved && saved.price ? saved.price : COURSE_PRICE
          });
        }).filter(Boolean);
      const custom = adminCourses.filter(function(course) {
        return course.id.indexOf('custom:') === 0;
      });
      return builtIn.concat(custom);
    }

    // Monta uma interface visual para aulas, links de vídeo e perguntas de alternativa.
    function setupAdminLessonBuilder(container, existingModules) {
      if (!container) return;
      let lessons = Array.isArray(existingModules) ? existingModules.map(function(module) {
        return {
          title: module.title || '',
          description: module.description || '',
          videoUrl: module.videoUrl || '',
          questions: Array.isArray(module.questions) ? module.questions.map(function(question) {
            return {
              prompt: question.prompt || '',
              options: Array.isArray(question.options) ? question.options.slice() : ['', ''],
              answer: Number.isInteger(question.answer) ? question.answer : 0
            };
          }) : []
        };
      }) : [];
      if (!lessons.length) lessons.push({ title: 'Atividade 1', description: '', videoUrl: '', questions: [] });

      function makeField(labelText, value, fieldName, placeholder, type) {
        const label = document.createElement('label');
        label.textContent = labelText;
        const input = type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
        if (type !== 'textarea') input.type = type || 'text';
        input.value = value || '';
        input.placeholder = placeholder || '';
        input.setAttribute('data-builder-field', fieldName);
        label.appendChild(input);
        return label;
      }

      function readBuilder() {
        lessons = Array.from(container.querySelectorAll('[data-builder-lesson]')).map(function(card) {
          const field = function(name) {
            const element = card.querySelector('[data-builder-field="' + name + '"]');
            return element ? element.value.trim() : '';
          };
          const questions = Array.from(card.querySelectorAll('[data-builder-question]')).map(function(questionCard) {
            const prompt = questionCard.querySelector('[data-question-prompt]').value.trim();
            const options = Array.from(questionCard.querySelectorAll('[data-question-option]')).map(function(input) {
              return input.value.trim();
            });
            const answer = Number(questionCard.querySelector('[data-question-correct]').value);
            return { prompt: prompt, options: options, answer: answer };
          });
          return { title: field('title'), description: field('description'), videoUrl: field('video'), questions: questions };
        });
        return lessons;
      }

      function renderBuilder() {
        container.innerHTML = '';
        lessons.forEach(function(lesson, lessonIndex) {
          const card = document.createElement('section');
          card.className = 'dg-demo-builder-card';
          card.setAttribute('data-builder-lesson', '');
          const heading = document.createElement('h4');
          heading.textContent = 'Aula ' + (lessonIndex + 1);
          card.appendChild(heading);
          const fields = document.createElement('div');
          fields.className = 'dg-demo-builder-fields';
          fields.appendChild(makeField('Nome da aula', lesson.title, 'title', 'Ex.: Introdução ao Excel'));
          fields.appendChild(makeField('Resumo da aula', lesson.description, 'description', 'O que o aluno vai aprender nesta aula', 'textarea'));
          fields.appendChild(makeField('Link do vídeo desta aula', lesson.videoUrl, 'video', 'https://www.youtube.com/watch?v=...', 'url'));
          card.appendChild(fields);

          const questions = document.createElement('div');
          questions.setAttribute('data-builder-questions', '');
          (lesson.questions || []).forEach(function(question, questionIndex) {
            const questionCard = document.createElement('section');
            questionCard.className = 'dg-demo-builder-question';
            questionCard.setAttribute('data-builder-question', '');
            const questionHeading = document.createElement('strong');
            questionHeading.textContent = 'Pergunta ' + (questionIndex + 1);
            questionCard.appendChild(questionHeading);
            const promptLabel = document.createElement('label');
            promptLabel.textContent = 'Enunciado';
            const promptInput = document.createElement('textarea');
            promptInput.value = question.prompt || '';
            promptInput.placeholder = 'Digite a pergunta';
            promptInput.setAttribute('data-question-prompt', '');
            promptLabel.appendChild(promptInput);
            questionCard.appendChild(promptLabel);
            const optionList = document.createElement('div');
            (question.options || []).forEach(function(option, optionIndex) {
              const optionRow = document.createElement('div');
              optionRow.className = 'dg-demo-builder-option';
              const optionInput = document.createElement('input');
              optionInput.type = 'text';
              optionInput.value = option;
              optionInput.placeholder = 'Alternativa ' + String.fromCharCode(65 + optionIndex);
              optionInput.setAttribute('data-question-option', '');
              optionRow.appendChild(optionInput);
              const removeOption = document.createElement('button');
              removeOption.type = 'button';
              removeOption.className = 'dg-demo-btn dg-demo-btn-light';
              removeOption.textContent = 'Remover';
              removeOption.setAttribute('data-builder-action', 'remove-option');
              removeOption.setAttribute('data-question-index', questionIndex);
              removeOption.setAttribute('data-option-index', optionIndex);
              optionRow.appendChild(removeOption);
              optionList.appendChild(optionRow);
            });
            questionCard.appendChild(optionList);
            const answerLabel = document.createElement('label');
            answerLabel.textContent = 'Alternativa correta';
            const answerSelect = document.createElement('select');
            answerSelect.setAttribute('data-question-correct', '');
            (question.options || []).forEach(function(option, optionIndex) {
              const optionElement = document.createElement('option');
              optionElement.value = optionIndex;
              optionElement.textContent = 'Alternativa ' + String.fromCharCode(65 + optionIndex) + (option ? ' — ' + option : '');
              optionElement.selected = Number(question.answer) === optionIndex;
              answerSelect.appendChild(optionElement);
            });
            answerLabel.appendChild(answerSelect);
            questionCard.appendChild(answerLabel);
            const questionActions = document.createElement('div');
            questionActions.className = 'dg-demo-builder-actions';
            const addOption = document.createElement('button');
            addOption.type = 'button';
            addOption.className = 'dg-demo-btn dg-demo-btn-light';
            addOption.textContent = '＋ Alternativa';
            addOption.setAttribute('data-builder-action', 'add-option');
            addOption.setAttribute('data-question-index', questionIndex);
            questionActions.appendChild(addOption);
            const removeQuestion = document.createElement('button');
            removeQuestion.type = 'button';
            removeQuestion.className = 'dg-demo-btn dg-demo-btn-light';
            removeQuestion.textContent = 'Remover pergunta';
            removeQuestion.setAttribute('data-builder-action', 'remove-question');
            removeQuestion.setAttribute('data-question-index', questionIndex);
            questionActions.appendChild(removeQuestion);
            questionCard.appendChild(questionActions);
            questions.appendChild(questionCard);
          });
          card.appendChild(questions);
          const actions = document.createElement('div');
          actions.className = 'dg-demo-builder-actions';
          const addQuizQuestion = document.createElement('button');
          addQuizQuestion.type = 'button';
          addQuizQuestion.className = 'dg-demo-btn dg-demo-btn-gold';
          addQuizQuestion.textContent = lesson.questions && lesson.questions.length ? '＋ Pergunta' : '＋ Questionário';
          addQuizQuestion.setAttribute('data-builder-action', 'add-question');
          actions.appendChild(addQuizQuestion);
          if (lessons.length > 1) {
            const removeLesson = document.createElement('button');
            removeLesson.type = 'button';
            removeLesson.className = 'dg-demo-btn dg-demo-btn-light';
            removeLesson.textContent = 'Remover aula';
            removeLesson.setAttribute('data-builder-action', 'remove-lesson');
            actions.appendChild(removeLesson);
          }
          card.appendChild(actions);
          container.appendChild(card);
        });
        const addLesson = document.createElement('button');
        addLesson.type = 'button';
        addLesson.className = 'dg-demo-btn dg-demo-btn-light';
        addLesson.textContent = '＋ Adicionar atividade / aula';
        addLesson.setAttribute('data-builder-action', 'add-lesson');
        container.appendChild(addLesson);
      }

      container.addEventListener('click', function(event) {
        const button = event.target.closest('[data-builder-action]');
        if (!button) return;
        readBuilder();
        const lessonIndex = Array.from(container.querySelectorAll('[data-builder-lesson]')).indexOf(button.closest('[data-builder-lesson]'));
        const action = button.getAttribute('data-builder-action');
        const questionIndex = Number(button.getAttribute('data-question-index'));
        const optionIndex = Number(button.getAttribute('data-option-index'));
        if (action === 'add-lesson') lessons.push({ title: 'Atividade ' + (lessons.length + 1), description: '', videoUrl: '', questions: [] });
        if (action === 'remove-lesson' && lessonIndex >= 0) lessons.splice(lessonIndex, 1);
        if (action === 'add-question' && lessonIndex >= 0) lessons[lessonIndex].questions.push({ prompt: '', options: ['', ''], answer: 0 });
        if (action === 'remove-question' && lessonIndex >= 0) lessons[lessonIndex].questions.splice(questionIndex, 1);
        if (action === 'add-option' && lessonIndex >= 0) lessons[lessonIndex].questions[questionIndex].options.push('');
        if (action === 'remove-option' && lessonIndex >= 0) {
          const question = lessons[lessonIndex].questions[questionIndex];
          if (question.options.length > 2) {
            question.options.splice(optionIndex, 1);
            if (question.answer >= question.options.length) question.answer = question.options.length - 1;
            else if (question.answer > optionIndex) question.answer -= 1;
          }
        }
        renderBuilder();
      });

      container.syncFields = function(form) {
        readBuilder();
        form.elements.modules.value = lessons.map(function(lesson) { return lesson.title + ' | ' + lesson.description; }).join('\n');
        form.elements.lessonVideos.value = lessons.map(function(lesson) { return lesson.videoUrl; }).join('\n');
        form.elements.quizQuestions.value = lessons.reduce(function(lines, lesson, lessonIndex) {
          lesson.questions.forEach(function(question) {
            lines.push((lessonIndex + 1) + ' | ' + question.prompt + ' | ' + question.options.join('; ') + ' | ' + (question.answer + 1));
          });
          return lines;
        }, []).join('\n');
      };
      renderBuilder();
    }

                '<div class="dg-demo-actions"><button class="dg-demo-btn" type="button" data-demo-action="open-course" data-course-index="' + index + '">Acessar curso</button></div></article>';

          : '<p class="dg-demo-subtitle">Você ainda não tem cursos comprados. Escolha um curso no catálogo para fazer uma matrícula simulada.</p>';
        content = '<h2 id="dg-demo-title">Meus cursos</h2>' +

          const questions = Array.isArray(lesson.questions) ? lesson.questions : [];

          const passed = Number.isFinite(lessonScore) && lessonScore >= 5;
          const videoMarkup = renderLessonVideo(lesson.videoUrl, lesson.title);
          const quizMarkup = questions.length
            ? (passed
              ? '<p class="dg-demo-grade">Atividade aprovada · Nota ' + lessonScore.toFixed(1) + '/10</p>'
              : '<form class="dg-demo-quiz" data-demo-form="lesson-quiz" data-lesson-index="' + index + '"><h4>Atividade da aula</h4>' + questions.map(function(question, questionIndex) {

        const courseStatus = playerCourse && playerCourse.completed

          : '<p class="dg-demo-subtitle">' + approvedLessons + ' de ' + lessons.length + ' atividades aprovadas · média final mínima: 7,0</p>';

        const certificate = certificateImage

          : '';

          courseStatus + '<div class="dg-demo-progress" role="progressbar" aria-label="Progresso do curso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + progressPercent + '"><span style="width:' + progressPercent + '%"></span></div>' +
          notice + storageNotice + certificate + lessonsMarkup +
          '<div class="dg-demo-actions"><button class="dg-demo-btn dg-demo-btn-light" type="button" data-demo-view="courses">Voltar aos meus cursos</button></div>';
      }

      demoContent.innerHTML = content;
      demoOverlay.classList.add('dg-demo-open');
      const title = demoContent.querySelector('#dg-demo-title');
      if (title) title.setAttribute('tabindex', '-1');
      if (title) title.focus();
      syncDemoAccountControls();

    // Alterna os links do cabeçalho entre entrar/cadastrar e o avatar da conta.
    function syncDemoAccountControls() {

      if (!header) return;

    // Renderiza vídeos diretos e links conhecidos de YouTube sem aceitar protocolos inseguros.
    function renderLessonVideo(value, title) {
      if (!value || !isAllowedMediaUrl(value)) {
        return '<p class="dg-demo-note">O vídeo desta aula ainda não foi cadastrado.</p>';
      }
      const videoUrl = new URL(value);
      if (/\.(mp4|webm|ogg)$/i.test(videoUrl.pathname)) {
        return '<video class="dg-demo-player" controls preload="metadata" src="' + escapeDemoText(videoUrl.href) + '" aria-label="Vídeo: ' + escapeDemoText(title) + '"></video>';
      }
      let youtubeId = '';
      if (videoUrl.hostname === 'youtu.be' || videoUrl.hostname === 'www.youtu.be') {
        youtubeId = videoUrl.pathname.slice(1).split('/')[0];
      } else if (/(^|\.)youtube\.com$/i.test(videoUrl.hostname)) {
        youtubeId = videoUrl.searchParams.get('v') || (videoUrl.pathname.match(/\/(?:embed|shorts)\/([^/]+)/) || [])[1] || '';
      }
      if (/^[\w-]{11}$/.test(youtubeId)) {
        return '<iframe class="dg-demo-player" src="https://www.youtube-nocookie.com/embed/' + youtubeId + '" title="' + escapeDemoText(title) + '" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
      }
      return '<p><a class="dg-demo-btn dg-demo-btn-light" href="' + escapeDemoText(videoUrl.href) + '" target="_blank" rel="noopener noreferrer">Abrir vídeo da aula</a></p>';
    }

    // Gera uma imagem PNG do certificado em alta resolução para visualizar ou baixar.
    function createCertificateImage(studentName, courseTitle, score, completedAt, workload) {
      const canvas = document.createElement('canvas');
      canvas.width = 1400;
      canvas.height = 1140;
      const context = canvas.getContext('2d');
      if (!context) return '';
      const width = canvas.width;
      const height = canvas.height;

      context.fillStyle = '#0B2B59';
      context.fillRect(0, 0, width, height);
      const card = { x: 50, y: 48, width: width - 100, height: height - 96 };
      context.save();
      context.translate(width / 2, height / 2);
      context.rotate(-0.018);
      context.translate(-width / 2, -height / 2);
      context.shadowColor = 'rgba(0,0,0,.3)';
      context.shadowBlur = 28;
      context.shadowOffsetX = 8;
      context.shadowOffsetY = 18;
      context.fillStyle = '#FFFFFF';
      context.beginPath();
      context.roundRect(card.x, card.y, card.width, card.height, 24);
      context.fill();
      context.shadowColor = 'transparent';
      context.lineWidth = 8;
      context.strokeStyle = '#F5B21B';
      context.stroke();
      context.lineWidth = 3;
      context.strokeStyle = '#0F5BB5';
      context.beginPath();
      context.roundRect(card.x + 24, card.y + 22, card.width - 48, card.height - 44, 8);
      context.stroke();
      context.lineWidth = 1.5;
      context.strokeStyle = 'rgba(15,91,181,.35)';
      context.beginPath();
      context.roundRect(card.x + 39, card.y + 37, card.width - 78, card.height - 74, 4);
      context.stroke();

      context.textAlign = 'center';
      context.textBaseline = 'middle';
      const logo = Array.from(document.images).find(function(image) {
        return image.alt === 'Logo Instituto Dragoni' && image.complete && image.naturalWidth > 0;
      });
      if (logo) context.drawImage(logo, width / 2 - 78, 66, 156, 164);
      context.fillStyle = '#0B3C7D';
      context.font = '700 30px Arial, sans-serif';
      context.letterSpacing = '7px';
      context.fillText('INSTITUTO DRAGONI', width / 2, 270);
      context.letterSpacing = '0px';

      context.fillStyle = '#07183A';
      context.font = '800 70px Arial, sans-serif';
      context.fillText('CERTIFICADO', width / 2, 380);
      context.fillStyle = '#B77900';
      context.font = '600 34px Arial, sans-serif';
      context.letterSpacing = '7px';
      context.fillText('DE CONCLUSÃO', width / 2, 435);
      context.letterSpacing = '0px';

      context.fillStyle = '#4A5878';
      context.font = '34px Arial, sans-serif';
      context.fillText('Certificamos que', width / 2, 555);

      context.fillStyle = '#0B3C7D';
      context.font = '700 58px Arial, sans-serif';
      const safeStudentName = String(studentName || 'Aluno(a)').slice(0, 50);
      context.fillText(safeStudentName, width / 2, 675, width - 250);
      context.strokeStyle = '#F5B21B';
      context.lineWidth = 4;
      context.beginPath();
      context.moveTo(300, 730);
      context.lineTo(width - 300, 730);
      context.stroke();

      context.fillStyle = '#4A5878';
      context.font = '34px Arial, sans-serif';
      context.fillStyle = '#4A5878';
      const certificateDescription = workload
        ? 'concluiu o curso de ' + String(courseTitle || 'Curso') + ' com carga horária de ' + String(workload) + ' horas.'
        : 'concluiu o curso de ' + String(courseTitle || 'Curso') + ' com aprovação.';
      const descriptionWords = certificateDescription.split(/\s+/);
      const descriptionLines = [''];
      descriptionWords.forEach(function(word) {
        const lineIndex = descriptionLines.length - 1;
        const candidate = descriptionLines[lineIndex] ? descriptionLines[lineIndex] + ' ' + word : word;
        if (context.measureText(candidate).width > width - 280 && descriptionLines[lineIndex]) descriptionLines.push(word);
        else descriptionLines[lineIndex] = candidate;
      });
      descriptionLines.forEach(function(line, index) {
        context.fillText(line, width / 2, 795 + index * 48, width - 220);
      });

      const dateValue = completedAt ? new Date(completedAt) : new Date();
      const validDate = Number.isNaN(dateValue.getTime()) ? new Date() : dateValue;
      context.strokeStyle = '#8794AA';
      context.lineWidth = 1.5;
      context.beginPath();
      context.moveTo(205, 950);
      context.lineTo(650, 950);
      context.moveTo(750, 950);
      context.lineTo(1195, 950);
      context.stroke();
      context.fillStyle = '#4A5878';
      context.font = '30px Arial, sans-serif';
      context.fillText('Direção', 427, 984);
      context.fillText('Data de emissão', 973, 984);
      context.font = '24px Arial, sans-serif';
      context.fillText(validDate.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }), 973, 1023);
      context.restore();

      return canvas.toDataURL('image/png');
    }

    // Cria um nome de arquivo simples e seguro a partir do nome do curso.
    function makeCertificateFilename(courseTitle) {
      return String(courseTitle || 'curso').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'curso';
    }

    // Registra o curso na conta depois da confirmação da compra demonstrativa.
    function completeDemoPurchase() {
      const user = getLoggedUser();
      if (!user) {
        showDemoView('login', 'Entre na sua conta para concluir a matrícula.');
        return;
      }
      user.courses = Array.isArray(user.courses) ? user.courses : [];
      const currentPrice = getCourseInfo(selectedCourse).price || COURSE_PRICE;
      const alreadyOwned = user.courses.some(function(course) { return course.title === selectedCourse; });
      if (!alreadyOwned) {
        user.courses.push({
          title: selectedCourse,
          price: currentPrice,
          paymentMethod: selectedPayment,
          completedLessons: []
        });
      }
      if (saveDemoData()) {
        showDemoView('courses', 'Compra simulada por ' + currentPrice + ' via ' + selectedPayment + ' concluída! O curso já está disponível na sua conta.');
      } else {
        if (!alreadyOwned) user.courses.pop();
        showDemoView('payment', storageMessage);
      }
    }

    // Interliga os formulários, botões de matrícula e ações da área do aluno.
    document.addEventListener('click', function(event) {
      const target = event.target;
      if (!(target instanceof Element)) return;
      // O site cria os links do menu mobile depois de abrir o menu.
      if (target.closest('.dg-burger')) window.setTimeout(syncDemoAccountControls, 50);
      // Reaplica ajustes quando um filtro recria os cards do catálogo.
      if (target.closest('#cursos button')) window.setTimeout(prepareCourseCatalog, 100);
      const actionButton = target.closest('[data-demo-action]');
      const viewButton = target.closest('[data-demo-view]');
      const courseLink = target.closest('#cursos article a');
      const loginLink = target.closest('a');
      const accountAvatar = target.closest('[data-demo-account-avatar]');
      const signupLink = target.closest('[data-demo-signup-link]');

      if (courseLink && courseLink.textContent.trim().toLowerCase() === 'saiba +') {
        event.preventDefault();
        const heading = courseLink.closest('article').querySelector('h3');
        if (heading) { 
          selectedCourse = heading.textContent.trim();
          showDemoView('details');
        }
        return;
      }
      if (loginLink && loginLink.textContent.trim().toLowerCase() === 'entrar') {
        event.preventDefault();
        showDemoView('login');
        return;
      }
      if (accountAvatar) {
        showDemoView('courses');
        return;
      }
      if (signupLink || (loginLink && (loginLink.textContent.trim().toLowerCase().startsWith('cadastre-se') ||
          loginLink.textContent.trim().toLowerCase().startsWith('quero me matricular') ||
          loginLink.textContent.trim().toLowerCase().startsWith('cadastre-se agora')))) {
        event.preventDefault();
        showDemoView('signup');
        return;
      }
      if (target === demoOverlay) {
        demoOverlay.classList.remove('dg-demo-open');
        return;
      }
      if (viewButton) {
        event.preventDefault();
        showDemoView(viewButton.getAttribute('data-demo-view'));
        return;
      }
      if (!actionButton) return;

      const action = actionButton.getAttribute('data-demo-action');
      if (action === 'close') {
        demoOverlay.classList.remove('dg-demo-open');
      } else if (action === 'new-admin-course') {
        if (!adminLoggedIn) {
          showDemoView('login', 'Entre como administrador para continuar.');
          return;
        }
        adminEditingId = '';
        renderAdminView('adminEditor');
      } else if (action === 'edit-admin-course') {
        if (!adminLoggedIn) {
          showDemoView('login', 'Entre como administrador para continuar.');
          return;
        }
        adminEditingId = actionButton.getAttribute('data-course-id');
        renderAdminView('adminEditor');
      } else if (action === 'delete-admin-course') {
        if (!adminLoggedIn) {
          showDemoView('login', 'Entre como administrador para continuar.');
          return;
        }
        const courseId = actionButton.getAttribute('data-course-id');
        const courseIndex = adminCourses.findIndex(function(course) {
          return course.id === courseId && course.id.indexOf('custom:') === 0;
        });
        if (courseIndex >= 0 && window.confirm('Quer mesmo excluir este curso do catálogo demonstrativo?')) {
          const deletedCourse = adminCourses.splice(courseIndex, 1)[0];
          if (saveAdminCourses()) {
            prepareCourseCatalog();
            renderAdminView('adminPanel', 'Curso excluído do catálogo demonstrativo.');
          } else {
            adminCourses.splice(courseIndex, 0, deletedCourse);
            renderAdminView('adminPanel', storageMessage);
          }
        }
      } else if (action === 'logout-admin') {
        adminLoggedIn = false;
        showDemoView('login', 'Você saiu da área administrativa.');
      } else if (action === 'start-enrollment') {
        beginDemoPurchase(selectedCourse);
      } else if (action === 'payment-options') {
        showDemoView('payment');
      } else if (action === 'confirm-purchase') {
        completeDemoPurchase();
      } else if (action === 'open-course') {
        selectedCourse = actionButton.getAttribute('data-course-index');
        showDemoView('player');
      } else if (action === 'complete-lesson') {
        const user = getLoggedUser();
        const course = user && user.courses[Number(selectedCourse)];
        const lessonIndex = Number(actionButton.getAttribute('data-lesson-index'));
        const lessonCount = course ? getCourseInfo(course.title).modules.length : 0;
        if (course && Number.isInteger(lessonIndex) && lessonIndex >= 0 && lessonIndex < lessonCount) {
          course.completedLessons = Array.isArray(course.completedLessons) ? course.completedLessons : [];
          const alreadyCompleted = course.completedLessons.indexOf(lessonIndex) >= 0;
          if (!alreadyCompleted) course.completedLessons.push(lessonIndex);
          if (saveDemoData()) showDemoView('player', 'Aula marcada como concluída.');
          else {
            if (!alreadyCompleted) course.completedLessons.pop();
            showDemoView('player', storageMessage);
          }
        }
      } else if (action === 'logout') {
        const previousEmail = demoData.currentEmail;
        demoData.currentEmail = null;
        if (saveDemoData()) showDemoView('login', 'Você saiu da sua conta.');
        else {
          demoData.currentEmail = previousEmail;
          showDemoView('courses', storageMessage);
        }
      } else if (action === 'browse-courses') {
        demoOverlay.classList.remove('dg-demo-open');
      }
    });

    // Valida cadastro e login e mantém a pessoa na matrícula se ela veio de um curso.
    demoOverlay.addEventListener('submit', function(event) {
      const form = event.target;
      if (!(form instanceof HTMLFormElement) || !form.hasAttribute('data-demo-form')) return;
      event.preventDefault();
      if (form.getAttribute('data-demo-form') === 'admin-course') {
        const builder = form.querySelector('[data-admin-builder]');
        if (builder && typeof builder.syncFields === 'function') builder.syncFields(form);
      }
      const formData = new FormData(form);
      const formType = form.getAttribute('data-demo-form');
      if (formType === 'lesson-quiz') {
        const user = getLoggedUser();
        const courseIndex = Number(selectedCourse);
        const playerCourse = user && user.courses[courseIndex];
        const lessonIndex = Number(form.getAttribute('data-lesson-index'));
        const lesson = playerCourse && getCourseInfo(playerCourse.title).modules[lessonIndex];
        const questions = lesson && Array.isArray(lesson.questions) ? lesson.questions : [];
        if (!playerCourse || !Number.isInteger(lessonIndex) || lessonIndex < 0 || !questions.length) {
          showDemoView('player', 'Não foi possível localizar esta atividade. Atualize a página e tente novamente.');
          return;
        }
        let correctAnswers = 0;
        questions.forEach(function(question, questionIndex) {
          if (String(formData.get('q' + questionIndex)) === String(question.answer)) correctAnswers += 1;
        });
        const score = Math.round((correctAnswers / questions.length) * 100) / 10;
        if (score < 5) {
          showDemoView('player', 'Sua nota foi ' + score.toFixed(1) + '/10. Como ficou abaixo de 5, refaça a atividade desta aula.');
          return;
        }

        const previousScores = Array.isArray(playerCourse.lessonScores) ? playerCourse.lessonScores.slice() : [];
        const previousCompleted = Array.isArray(playerCourse.completedLessons) ? playerCourse.completedLessons.slice() : [];
        const previousFinalScore = playerCourse.finalScore;
        const previousCourseCompleted = playerCourse.completed;
        const previousCompletedAt = playerCourse.completedAt;
        const courseModules = getCourseInfo(playerCourse.title).modules;
        playerCourse.lessonScores = previousScores;
        playerCourse.lessonScores[lessonIndex] = score;
        playerCourse.completedLessons = previousCompleted;
        if (playerCourse.completedLessons.indexOf(lessonIndex) < 0) playerCourse.completedLessons.push(lessonIndex);
        const everyLessonHasQuiz = courseModules.length > 0 && courseModules.every(function(module) {
          return Array.isArray(module.questions) && module.questions.length > 0;
        });
        const allActivitiesPassed = everyLessonHasQuiz && courseModules.every(function(module, index) {
          return Number(playerCourse.lessonScores[index]) >= 5;
        });
        let resultMessage = 'Boa! Atividade aprovada com nota ' + score.toFixed(1) + '/10.';
        if (allActivitiesPassed) {
          const finalScore = Math.round((playerCourse.lessonScores.reduce(function(total, value) {
            return total + Number(value);
          }, 0) / courseModules.length) * 10) / 10;
          if (finalScore < 7) {
            playerCourse.lessonScores = [];
            playerCourse.completedLessons = [];
            playerCourse.finalScore = null;
            playerCourse.completed = false;
            resultMessage = 'A média do curso foi ' + finalScore.toFixed(1) + '/10, abaixo de 7. É necessário refazer todas as atividades.';
          } else {
            playerCourse.finalScore = finalScore;
            playerCourse.completed = true;
            playerCourse.completedAt = new Date().toISOString();
            resultMessage = 'Parabéns! Você concluiu o curso com média ' + finalScore.toFixed(1) + '/10.';
          }
        }
        if (saveDemoData()) {
          showDemoView('player', resultMessage);
        } else {
          playerCourse.lessonScores = previousScores;
          playerCourse.completedLessons = previousCompleted;
          playerCourse.finalScore = previousFinalScore;
          playerCourse.completed = previousCourseCompleted;
          playerCourse.completedAt = previousCompletedAt;
          showDemoView('player', storageMessage);
        }
        return;
      }
      if (formType === 'admin-course') {
        if (!adminLoggedIn) {
          showDemoView('login', 'Entre como administrador para salvar alterações.');
          return;
        }
        function showEditorError(message) {
          const oldNotice = form.querySelector('[data-editor-error]');
          if (oldNotice) oldNotice.remove();
          const errorNotice = document.createElement('div');
          errorNotice.className = 'dg-demo-error';
          errorNotice.setAttribute('role', 'alert');
          errorNotice.setAttribute('data-editor-error', '');
          errorNotice.textContent = message;
          form.prepend(errorNotice);
        }
        const id = String(formData.get('id') || '');
        const originalTitle = String(formData.get('originalTitle') || '');
        const title = String(formData.get('title') || '').trim();
        const category = String(formData.get('category') || '').trim();
        const price = String(formData.get('price') || '').trim();
        const description = String(formData.get('description') || '').trim();
        const outcomes = String(formData.get('outcomes') || '').split(/\r?\n/).map(function(item) {
          return item.trim();
        }).filter(Boolean);
        const moduleLines = String(formData.get('modules') || '').split(/\r?\n/).map(function(line) {
          return line.trim();
        }).filter(Boolean);
        const modules = moduleLines.map(function(line) {
          const separator = line.indexOf('|');
          if (separator < 1) return null;
          const moduleTitle = line.slice(0, separator).trim();
          const moduleDescription = line.slice(separator + 1).trim();
          return moduleTitle && moduleDescription ? { title: moduleTitle, description: moduleDescription, videoUrl: '', questions: [] } : null;
        });
        const videoLines = String(formData.get('lessonVideos') || '').split(/\r?\n/);
        const quizLines = String(formData.get('quizQuestions') || '').split(/\r?\n/).map(function(line) {
          return line.trim();
        }).filter(Boolean);
        const invalidVideoRows = videoLines.slice(modules.length).some(function(url) { return url.trim(); });
        videoLines.slice(0, modules.length).forEach(function(url, index) {
          const cleanUrl = url.trim();
          if (!modules[index] || (cleanUrl && !isAllowedMediaUrl(cleanUrl))) return;
          modules[index].videoUrl = cleanUrl;
        });
        const invalidVideo = invalidVideoRows || videoLines.slice(0, modules.length).some(function(url) {
          return url.trim() && !isAllowedMediaUrl(url.trim());
        });
        let invalidQuiz = false;
        quizLines.forEach(function(line) {
          const parts = line.split('|').map(function(part) { return part.trim(); });
          const lessonNumber = Number(parts[0]);
          const options = parts[2] ? parts[2].split(';').map(function(option) { return option.trim(); }).filter(Boolean) : [];
          const answerNumber = Number(parts[3]);
          if (parts.length !== 4 || !Number.isInteger(lessonNumber) || lessonNumber < 1 || lessonNumber > modules.length ||
              !parts[1] || options.length < 2 || !Number.isInteger(answerNumber) || answerNumber < 1 || answerNumber > options.length) {
            invalidQuiz = true;
            return;
          }
          if (!modules[lessonNumber - 1]) {
            invalidQuiz = true;
            return;
          }
          modules[lessonNumber - 1].questions.push({ prompt: parts[1], options: options, answer: answerNumber - 1 });
        });
        if (modules.some(function(module) { return module && module.questions.length === 0; })) invalidQuiz = true;
        const imageUrl = String(formData.get('imageUrl') || '').trim();
        const videoUrl = String(formData.get('videoUrl') || '').trim();
        const studyFormat = String(formData.get('studyFormat') || '').trim();
        const workload = String(formData.get('workload') || '').trim();
        const invalidWorkload = workload && (!/^\d{1,5}$/.test(workload) || Number(workload) < 1 || Number(workload) > 10000);
        const invalidMedia = (imageUrl && !isAllowedMediaUrl(imageUrl)) || (videoUrl && !isAllowedMediaUrl(videoUrl));

        if (!title || !category || !price || !description || outcomes.length === 0 ||
            modules.length === 0 || modules.some(function(module) { return !module; }) || invalidMedia || invalidVideo || invalidQuiz || invalidWorkload) {
          showEditorError('Revise os campos obrigatórios. Cada aula precisa de título, descrição e ao menos uma pergunta com duas alternativas e resposta correta. Os vídeos devem usar links HTTP/HTTPS.');
          return;
        }

          return course.title.toLocaleLowerCase() === title.toLocaleLowerCase() && course.id !== id;
        });
        if (duplicate) {
          showEditorError('Já existe um curso com esse nome. Escolha outro título.');
          return;
        }

        const record = {
          id: id || 'custom:' + Date.now() + ':' + Math.random().toString(16).slice(2),
          originalTitle: originalTitle,
          title: title,
          category: category,
          price: price,
          description: description,
          outcomes: outcomes,
          modules: modules,
          imageUrl: imageUrl,
          videoUrl: videoUrl,
          studyFormat: studyFormat,
          workload: workload
        };
        const previousIndex = adminCourses.findIndex(function(course) {
          return course.id === record.id;
        });
        const previousRecord = previousIndex >= 0 ? adminCourses[previousIndex] : null;
        if (previousIndex >= 0) adminCourses[previousIndex] = record;
        else adminCourses.push(record);

        if (!saveAdminCourses()) {
          if (previousIndex >= 0) adminCourses[previousIndex] = previousRecord;
          else adminCourses.pop();
          showEditorError(storageMessage);
          return;
        }
        courseCurricula[record.title] = record;
        prepareCourseCatalog();
        renderAdminView('adminPanel', 'Curso salvo e publicado no catálogo deste navegador.');
        return;
      }
      if (formType === 'payment') {
        const paymentMethod = String(formData.get('payment') || '');
        if (['Pix', 'Cartão', 'Boleto'].indexOf(paymentMethod) < 0) {
          showDemoView('payment', 'Selecione uma forma de pagamento para continuar.');
          return;
        }
        selectedPayment = paymentMethod;
        completeDemoPurchase();
        return;
      }

      const email = String(formData.get('email') || '').trim().toLowerCase();
      const password = String(formData.get('password') || '');
      const previousEmail = demoData.currentEmail;
      let createdUser = null;

      if (formType === 'login' && email === ADMIN_EMAIL) {
        if (password !== ADMIN_PASSWORD) {
          showDemoView('login', 'E-mail ou senha incorretos. Confira os dados e tente novamente.');
          return;
        }
        adminLoggedIn = true;
        renderAdminView('adminPanel', 'Login administrativo realizado.');
        return;
      }

      if (formType === 'signup') {
        const name = String(formData.get('name') || '').trim();
        if (!name || password.length < 6 || !email) {
          showDemoView('signup', 'Preencha seu nome, um e-mail válido e uma senha com pelo menos 6 caracteres.');
          return;
        }
        if (demoData.users.some(function(user) { return user.email === email; })) {
          showDemoView('signup', 'Já existe uma conta com esse e-mail. Entre ou use outro endereço.');
          return;
        }
        createdUser = { name: name, email: email, password: password, courses: [] };
        demoData.users.push(createdUser);
      } else {
        const matchingUser = demoData.users.find(function(user) {
          return user.email === email && user.password === password;
        });
        if (!matchingUser) {
          showDemoView('login', 'E-mail ou senha incorretos. Se ainda não tem conta, faça seu cadastro.');
          return;
        }
      }

      demoData.currentEmail = email;
      if (!saveDemoData()) {
        demoData.currentEmail = previousEmail;
        if (createdUser) demoData.users.pop();
        showDemoView(formType, storageMessage);
        return;
      }
      if (pendingCourse) {
        selectedCourse = pendingCourse;
        pendingCourse = '';
        showDemoView('payment');
      } else {
        showDemoView('courses', formType === 'signup' ? 'Conta criada com sucesso!' : 'Login realizado com sucesso!');
      }
    });

    // Permite fechar a janela com Escape.
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') demoOverlay.classList.remove('dg-demo-open');
    });

  }

Fspan>\n<span>[CNPJ]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<!-- BOTAO AJUDA -->\n<a href=\"#contato\" style=\"position:fixed;right:20px;bottom:20px;z-index:80;display:flex;align-items:center;gap:10px;padding:14px 22px;background:#0F5BB5;border-radius:999px;box-shadow:0 14px 34px rgba(7,24,58,0.4);font-size:15px;font-weight:800;color:#FFFFFF\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F5B21B\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><\u002Fsvg>Ajuda<\u002Fa>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5300}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { menuOpen: false, mobileOpen: false, filter: 'Todos', faqOpen: 0 };\n  }\n\n  renderVals() {\n    const names = [\n      'Administração', 'Comunicação e Marketing', 'Construção Civil', 'Contabilidade e Economia',\n      'Direito', 'Educação e Pedagogia', 'Gastronomia', 'Idiomas', 'Informática', 'Meio Ambiente',\n      'Música', 'Nutrição', 'Odontologia', 'Outras Áreas', 'Psicologia', 'Recursos Humanos',\n      'Saúde & Bem-Estar', 'Turismo e Hotelaria', 'Veterinária'\n    ];\n    const categories = names.map((name) => ({ name, initial: name.charAt(0) }));\n\n    const allCourses = [\n      { cat: 'Tecnologia', title: 'Informática Básica' },\n      { cat: 'Tecnologia', title: 'Excel do Básico ao Avançado' },\n      { cat: 'Tecnologia', title: 'Segurança da Informação' },\n      { cat: 'Tecnologia', title: 'Marketing Digital' },\n      { cat: 'Saúde', title: 'Primeiros Socorros' },\n      { cat: 'Saúde', title: 'Nutrição e Alimentação Saudável' },\n      { cat: 'Saúde', title: 'Cuidador de Idosos' },\n      { cat: 'Gestão', title: 'Administração Geral' },\n      { cat: 'Gestão', title: 'Recursos Humanos' },\n      { cat: 'Gestão', title: 'Contabilidade Básica' },\n      { cat: 'Educação', title: 'Educação Infantil' },\n      { cat: 'Educação', title: 'Psicopedagogia' },\n      { cat: 'Idiomas', title: 'Inglês Instrumental' },\n      { cat: 'Idiomas', title: 'Espanhol Básico' }\n    ].map((c) => ({ ...c, hours: '[00] horas', price: 'R$ [PREÇO]' }));\n\n    const filter = this.state.filter;\n    const courses = allCourses.filter((c) => filter === 'Todos' || c.cat === filter);\n\n    const tabs = ['Todos', 'Tecnologia', 'Saúde', 'Gestão', 'Educação', 'Idiomas'].map((label) => ({\n      label,\n      active: filter === label,\n      inactive: filter !== label,\n      pick: () => this.setState({ filter: label })\n    }));\n\n    const faqData = [\n      { q: 'Como faço para me matricular?', a: 'Escolha o curso desejado, clique em Matricular, crie seu cadastro e finalize o pagamento. O acesso à plataforma é liberado após a confirmação.' },\n      { q: 'Posso estudar pelo celular?', a: 'Sim. A plataforma funciona no celular, tablet ou computador, e você estuda no horário que preferir.' },\n      { q: 'Como recebo o meu certificado?', a: 'Ao concluir o curso e as atividades, o certificado fica disponível na sua área do aluno para emissão e download.' },\n      { q: 'Quais são as formas de pagamento?', a: '[Informe aqui as formas de pagamento aceitas: cartão, Pix, boleto etc.]' },\n      { q: 'Existe prazo para concluir o curso?', a: '[Informe aqui o prazo de acesso de cada curso.]' }\n    ];\n    const faqs = faqData.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: this.state.faqOpen === i,\n      closed: this.state.faqOpen !== i,\n      toggle: () => this.setState({ faqOpen: this.state.faqOpen === i ? -1 : i })\n    }));\n\n    return {\n      categories,\n      courses,\n      tabs,\n      faqs,\n      menuOpen: this.state.menuOpen,\n      mobileOpen: this.state.mobileOpen,\n      openMenu: () => this.setState({ menuOpen: true }),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),\n      toggleMobile: () => this.setState({ mobileOpen: !this.state.mobileOpen })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
